[project]
name = "mlframework"
version = "0.1.0"
description = "Custom MLOps framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "efficient-kan @ git+https://github.com/Blealtan/efficient-kan.git",
    "hydra-core>=1.3.2",
    "mlflow>=2.15.1",
    "python-dotenv>=1.2.2",
    "pytorch-lightning>=2.4.0",
    "rich>=13.7.1",
    "torch",
    "torchaudio",
    "torchmetrics>=1.4.0",
    "torchvision",
    "typer>=0.12.3",
]

[tool.uv]
prerelease = "allow"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

# Перемикаємося на актуальний свіжий індекс з підтримкою нових GPU
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
